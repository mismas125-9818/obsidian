[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-client-py"
version = "0.1.0"
description = "Python klient pre prácu s Obsidian Local REST API"
readme = "README.md"
authors = [{ name = "Michal Krigler", email = "mumintrol17812@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.7"
dependencies = [
    "requests>=2.25.0",
    "urllib3>=1.26.0"
]

[project.urls]
"Homepage" = "https://github.com/tvoje-uzivatelske-meno/obsidian-client"